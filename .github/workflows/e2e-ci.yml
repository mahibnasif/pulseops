name: End-to-End CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "demo-service/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "demo-service/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mvp-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Generate isolated test secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Start isolated test stack
        env:
          FRONTEND_PORT: "5180"
          BACKEND_PORT: "8180"
          POSTGRES_PORT: "55432"
          DEMO_PORT: "8191"
          MONITORING_ALLOW_PRIVATE_TARGETS: "true"
          MONITORING_SCHEDULER_ENABLED: "false"
          AUTH_RATE_LIMIT_REGISTRATION_ATTEMPTS: "100"
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:5180
        run: docker compose --profile demo -p pulseops-e2e up --build --detach --wait

      - name: Run MVP browser journey
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5180
          E2E_DEMO_URL: http://127.0.0.1:8191
        run: npm run test:e2e

      - name: Run backend load smoke
        env:
          LOAD_BASE_URL: http://127.0.0.1:8180
          LOAD_REQUESTS: "250"
          LOAD_CONCURRENCY: "20"
          LOAD_MAX_P95_MS: "1500"
          LOAD_MAX_ERROR_RATE: "0.01"
        run: node scripts/load-test.mjs

      - name: Capture container logs
        if: failure()
        run: docker compose --profile demo -p pulseops-e2e logs --no-color

      - name: Stop isolated test stack
        if: always()
        run: docker compose --profile demo -p pulseops-e2e down --volumes --remove-orphans
