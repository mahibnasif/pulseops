name: pulseops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pulseops} -d ${POSTGRES_DB:-pulseops}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pulseops}
      DATABASE_USERNAME: ${POSTGRES_USER:-pulseops}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Run .\scripts\setup.ps1 to generate JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-pulseops}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pulseops-web}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-30d}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_LOGIN_ATTEMPTS: ${AUTH_RATE_LIMIT_LOGIN_ATTEMPTS:-10}
      AUTH_RATE_LIMIT_LOGIN_WINDOW: ${AUTH_RATE_LIMIT_LOGIN_WINDOW:-5m}
      AUTH_RATE_LIMIT_REGISTRATION_ATTEMPTS: ${AUTH_RATE_LIMIT_REGISTRATION_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_REGISTRATION_WINDOW: ${AUTH_RATE_LIMIT_REGISTRATION_WINDOW:-1h}
      AUTH_RATE_LIMIT_REFRESH_ATTEMPTS: ${AUTH_RATE_LIMIT_REFRESH_ATTEMPTS:-30}
      AUTH_RATE_LIMIT_REFRESH_WINDOW: ${AUTH_RATE_LIMIT_REFRESH_WINDOW:-5m}
      AUTH_RATE_LIMIT_MAX_TRACKED_KEYS: ${AUTH_RATE_LIMIT_MAX_TRACKED_KEYS:-10000}
      AUTH_RATE_LIMIT_TRUST_PROXY_CLIENT_IP: ${AUTH_RATE_LIMIT_TRUST_PROXY_CLIENT_IP:-true}
      MONITORING_ALLOW_PRIVATE_TARGETS: ${MONITORING_ALLOW_PRIVATE_TARGETS:-false}
      MONITORING_MAX_RESPONSE_BYTES: ${MONITORING_MAX_RESPONSE_BYTES:-65536}
      MONITORING_SCHEDULER_ENABLED: ${MONITORING_SCHEDULER_ENABLED:-true}
      MONITORING_POLL_INTERVAL_MILLISECONDS: ${MONITORING_POLL_INTERVAL_MILLISECONDS:-5000}
      MONITORING_BATCH_SIZE: ${MONITORING_BATCH_SIZE:-10}
      MONITORING_CLAIM_LEASE_SECONDS: ${MONITORING_CLAIM_LEASE_SECONDS:-120}
      PULSEOPS_LIVE_EVENTS_HEARTBEAT_MILLISECONDS: ${LIVE_EVENT_HEARTBEAT_MILLISECONDS:-15000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
