spring:
  application:
    name: pulseops-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pulseops}
    username: ${DATABASE_USERNAME:pulseops}
    password: ${DATABASE_PASSWORD:pulseops}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

pulseops:
  auth:
    issuer: ${JWT_ISSUER:pulseops}
    audience: ${JWT_AUDIENCE:pulseops-web}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    jwt-secret: ${JWT_SECRET}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
