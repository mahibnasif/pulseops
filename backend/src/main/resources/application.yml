spring:
  application:
    name: pulseops-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pulseops}
    username: ${DATABASE_USERNAME:pulseops}
    password: ${DATABASE_PASSWORD:pulseops}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

pulseops:
  auth:
    issuer: ${JWT_ISSUER:pulseops}
    audience: ${JWT_AUDIENCE:pulseops-web}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    jwt-secret: ${JWT_SECRET}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth-rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    login-attempts: ${AUTH_RATE_LIMIT_LOGIN_ATTEMPTS:10}
    login-window: ${AUTH_RATE_LIMIT_LOGIN_WINDOW:5m}
    registration-attempts: ${AUTH_RATE_LIMIT_REGISTRATION_ATTEMPTS:5}
    registration-window: ${AUTH_RATE_LIMIT_REGISTRATION_WINDOW:1h}
    refresh-attempts: ${AUTH_RATE_LIMIT_REFRESH_ATTEMPTS:30}
    refresh-window: ${AUTH_RATE_LIMIT_REFRESH_WINDOW:5m}
    max-tracked-keys: ${AUTH_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
    trust-proxy-client-ip: ${AUTH_RATE_LIMIT_TRUST_PROXY_CLIENT_IP:false}
  monitoring:
    allow-private-targets: ${MONITORING_ALLOW_PRIVATE_TARGETS:false}
    max-response-bytes: ${MONITORING_MAX_RESPONSE_BYTES:65536}
    scheduler-enabled: ${MONITORING_SCHEDULER_ENABLED:true}
    poll-interval-milliseconds: ${MONITORING_POLL_INTERVAL_MILLISECONDS:5000}
    batch-size: ${MONITORING_BATCH_SIZE:10}
    claim-lease-seconds: ${MONITORING_CLAIM_LEASE_SECONDS:120}
