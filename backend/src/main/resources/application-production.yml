spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: ${DATABASE_MIGRATIONS_ENABLED:false}

server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${DEPLOYMENT_ENVIRONMENT:production}

pulseops:
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth-rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    trust-proxy-client-ip: ${AUTH_RATE_LIMIT_TRUST_PROXY_CLIENT_IP:true}
  monitoring:
    allow-private-targets: ${MONITORING_ALLOW_PRIVATE_TARGETS:false}
